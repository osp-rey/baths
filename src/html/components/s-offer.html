<section class="s-offer sect-m">
  <div class="container">
    <div
      class="s-offer__wrap"
      style="
        background: url(&quot;@img/offer-bg.jpg&quot;) center / cover no-repeat;
      "
    >
      <div class="s-offer__body">
        <div class="s-offer__body-inside">
          <h2 class="f-title s-offer__title">
            ПОЛУЧИТЕ СКИДКУ 10% ПРИ БРОНИРОВАНИИ ЧЕРЕЗ САЙТ
          </h2>
          <p class="s-offer__content">
            Оставьте контакты, и мы подберем для вас удобное время, расскажем
            об условиях и зафиксируем скидку 10%
          </p>
          <form action="#" class="s-offer__form">
            <div class="input-control">
              <input type="text" placeholder="Ваше имя" class="input" />
            </div>
            <div class="input-control">
              <input
                type="tel"
                placeholder="Ваш номер телефона"
                class="input"
              />
            </div>
            <div class="input-control">
              <input type="number" placeholder="Кол-во гостей" class="input" />
            </div>
            <div class="input-control">
              <input type="text" placeholder="Желаемая дата" class="input" />
            </div>
            <div class="input-control">
              <div class="select">
                <div class="select-btn">
                  <input
                    type="text"
                    placeholder="Выберите формат отдыха"
                    readonly
                    class="input select-input"
                  />
                  <svg class="arrow">
                    <use
                      xlink:href="img/icons/icons.svg#icon-arrow-bottom"
                    ></use>
                  </svg>
                </div>
                <div class="select-body">
                  <div class="select-body-wrap">
                    <div class="select-item">Формат отдыха 1</div>
                    <div class="select-item">Формат отдыха 2</div>
                    <div class="select-item">Формат отдыха 3</div>
                    <div class="select-item">Формат отдыха 4</div>
                    <div class="select-item">Формат отдыха 5</div>
                    <div class="select-item">Формат отдыха 6</div>
                    <div class="select-item">Формат отдыха 7</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="check-wrapper">
              <span class="wpcf7-form-control-wrap">
                <span class="wpcf7-form-control wpcf7-acceptance">
                  <span class="wpcf7-list-item">
                    <label>
                      <input type="checkbox" name="acceptance-469" />
                      <span class="wpcf7-list-item-label">
                        <span>
                          Я соглашаюсь с&nbsp;
                          <a href="/personal-data" target="_blank">
                            Правилами обработки персональных данных
                          </a>
                        </span>
                      </span>
                    </label>
                  </span>
                </span>
              </span>
            </div>
            <button type="submit" class="btn-s">ЗАБРОНИРОВАТЬ</button>
          </form>
        </div>
      </div>
      <div class="s-offer__footer"></div>
    </div>
  </div>
</section>
